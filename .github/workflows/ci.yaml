name: CI

on:
  push:
    branches:
      - main

env:
  REGION: us-central1
  PROJECT_ID: vc-core-test
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: app-registry
  IMAGE_NAME: vibecheck-ui
  MANIFEST_PATH: manifests/frontend/deployment.yaml

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # obligatorio para WIF

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Debug GitHub context
        run: |
          echo "REPO=${{ github.repository }}"

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Dump credentials file
        run: |
          cat "$GOOGLE_GHA_CREDS_PATH"

      - name: Debug auth
        run: |
          gcloud auth list
          gcloud config list account
          gcloud auth print-access-token >/dev/null && echo "TOKEN_OK"

      - name: Debug ADC
        run: |
          gcloud auth application-default print-access-token >/dev/null && echo "ADC_OK"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE_URL=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG=${{ github.sha }}

          docker build -t $IMAGE_URL:$IMAGE_TAG -t $IMAGE_URL:latest .
          docker push $IMAGE_URL:$IMAGE_TAG
          docker push $IMAGE_URL:latest

          echo "IMAGE_URL=$IMAGE_URL" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Update image tag in vibecheck-infra
        run: |
          git clone https://x-access-token:${{ secrets.INFRA_REPO_TOKEN }}@github.com/UNLu-SIP-VibeCheck-2026/vibecheck-infra.git
          cd vibecheck-infra

          sed -i "s|image: ${{ env.IMAGE_URL }}:.*|image: ${{ env.IMAGE_URL }}:${{ env.IMAGE_TAG }}|" ${{ env.MANIFEST_PATH }}

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add ${{ env.MANIFEST_PATH }}
          git diff --staged --quiet || git commit -m "chore: update ${{ env.IMAGE_NAME }} to ${{ env.IMAGE_TAG }}"
          git push
