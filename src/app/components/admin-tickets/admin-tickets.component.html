<div class="admin-container">
    <div class="header-section">
        <button mat-icon-button (click)="goBack()" class="back-btn">
            <mat-icon>arrow_back</mat-icon>
        </button>
        <h1 class="main-title">Administrar Tickets - Evento: {{eventId}}</h1>
    </div>

    <div class="table-container mat-elevation-z0">
        <table mat-table [dataSource]="dataSource" class="custom-table">
            
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef> ID Ticket </th>
                <td mat-cell *matCellDef="let element"> {{element.id}} </td>
            </ng-container>

            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef> Nombre de Ticket </th>
                <td mat-cell *matCellDef="let element"> {{element.name}} </td>
            </ng-container>

            <ng-container matColumnDef="price">
                <th mat-header-cell *matHeaderCellDef> Precio $VBK </th>
                <td mat-cell *matCellDef="let element"> {{element.price}} </td>
            </ng-container>

            <ng-container matColumnDef="maxPrice">
                <th mat-header-cell *matHeaderCellDef> Precio Máximo </th>
                <td mat-cell *matCellDef="let element"> {{element.maxPrice}} </td>
            </ng-container>

            <ng-container matColumnDef="royalties">
                <th mat-header-cell *matHeaderCellDef> Regalías % </th>
                <td mat-cell *matCellDef="let element"> {{element.royalties}}% </td>
            </ng-container>

            <ng-container matColumnDef="venueZone">
                <th mat-header-cell *matHeaderCellDef> Ubicación </th>
                <td mat-cell *matCellDef="let element"> {{element.venueZone}} </td>
            </ng-container>

            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef> Estado </th>
                <td mat-cell *matCellDef="let element">
                    <mat-chip class="custom-chip" [ngClass]="element.status === 'DISPONIBLE' ? 'active-chip' : 'inactive-chip'">
                        {{element.status}}
                    </mat-chip>
                </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> Acciones </th>
                <td mat-cell *matCellDef="let element">
                    <button mat-icon-button class="circle-btn">
                        <mat-icon>edit</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>
    </div>
</div>
