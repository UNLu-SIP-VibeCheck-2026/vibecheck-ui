<div class="profile-page">
  <!-- Back Button Header -->
  <div class="header" style="display: flex; align-items: center; gap: 16px; margin-bottom: 32px; width: 100%;">
    <button mat-icon-button (click)="goBack()" style="color: white; background: rgba(255, 255, 255, 0.05);">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1 style="margin: 0; background: var(--gradient-brand); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 900; font-size: 2.2rem; font-family: inherit;">PERFIL</h1>
  </div>

  @if (isLoading()) {
    <!-- Estado de carga -->
    <div class="loading-state">
      <div class="skeleton-avatar"></div>
      <div class="skeleton-line wide"></div>
      <div class="skeleton-line narrow"></div>
    </div>
  } @else if (hasError()) {
    <!-- Estado de error -->
    <div class="error-state">
      <div class="error-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="currentColor" stroke-width="1.5"/>
          <path d="M12 8V12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="12" cy="16" r="0.75" fill="currentColor"/>
        </svg>
      </div>
      <p class="error-title">Usuario no encontrado</p>
      <p class="error-subtitle">El perfil que buscás no existe o no está disponible.</p>
    </div>
  } @else if (profile()) {
    <!-- Contenido del perfil -->
    <div class="profile-content">
      
      <!-- Avatar con iniciales -->
      <div class="avatar-wrapper">
        <div class="avatar">{{ initials() }}</div>
      </div>

      <!-- Identidad -->
      <div class="identity-section">
        <h1 class="display-name">{{ fullName() }}</h1>
        <p class="username">&#64;{{ profile()?.username }}</p>
      </div>

      <!-- Datos públicos -->
      <div class="info-cards">
        <div class="info-card">
          <span class="info-label">Rol</span>
          <span class="info-value role-badge">{{ profile()?.role }}</span>
        </div>
      </div>

    </div>
  }

</div>
