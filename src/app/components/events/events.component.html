<div class="events-container">
  <div class="events-header">
    <div class="title-row">
      <div class="title-search-wrapper">
        <h1 class="display-medium">Eventos</h1>
        <mat-form-field appearance="outline" class="search-field" subscriptSizing="dynamic">
          <input matInput placeholder="Buscar por evento o locación..." [(ngModel)]="searchQuery" (ngModelChange)="applyFilter()">
          <span matSuffix class="search-icon-wrapper">
            <mat-icon>search</mat-icon>
          </span>
        </mat-form-field>
      </div>
      <div class="pills-container">
        <button 
          class="pill-button" 
          [class.active]="selectedPill === 'Próximos eventos'"
          (click)="selectPill('Próximos eventos')">
          Próximos eventos
        </button>
        <button 
          class="pill-button" 
          [class.active]="selectedPill === 'Recomendados'"
          (click)="selectPill('Recomendados')">
          Recomendados
        </button>
        <button 
          class="pill-button" 
          [class.active]="selectedPill === 'Cerca tuyo'"
          (click)="selectPill('Cerca tuyo')">
          Cerca tuyo
        </button>
        <button 
          class="pill-button special" 
          [class.active]="selectedPill === 'Marketplace'"
          (click)="selectPill('Marketplace')">
          Marketplace
        </button>
      </div>
    </div>
    <h2 class="headline-medium selected-pill-title">{{ selectedPill }}</h2>
  </div>

  <!-- Loading State -->
  <app-loading-state 
    *ngIf="isLoading" 
    [mode]="'skeleton'" 
    [skeletonType]="'card'" 
    [count]="8"
    [gridClass]="selectedPill === 'Marketplace' ? 'events-grid marketplace-grid' : 'events-grid'">
  </app-loading-state>

  <!-- Empty State -->
  <app-empty-state 
    *ngIf="!isLoading && pagedEvents.length === 0" 
    [icon]="selectedPill === 'Marketplace' ? 'storefront' : 'event_busy'" 
    [title]="'No se encontraron eventos'" 
    [description]="searchQuery ? 'No encontramos eventos que coincidan con tu búsqueda: \'' + searchQuery + '\'.' : 'Por el momento no hay eventos disponibles en la categoría: ' + selectedPill + '.'"
    [actionText]="searchQuery ? 'Limpiar búsqueda' : ''"
    (actionClick)="searchQuery = ''; applyFilter()">
  </app-empty-state>

  <!-- Events Grid -->
  <div *ngIf="!isLoading && pagedEvents.length > 0" class="events-grid" [class.marketplace-grid]="selectedPill === 'Marketplace'">
    <div class="event-card" [class.marketplace-card]="selectedPill === 'Marketplace'" *ngFor="let event of pagedEvents" (click)="navigateToEvent(event.id)">
      <div class="event-image-container">
        <img *ngIf="getEventImage(event.id)" [src]="getEventImage(event.id)" [alt]="event.title" class="event-image">
        <div *ngIf="!getEventImage(event.id)" class="no-image-placeholder">
          <mat-icon>image_not_supported</mat-icon>
        </div>
      </div>
      
      <!-- Regular Info -->
      <div class="event-info" *ngIf="selectedPill !== 'Marketplace'">
        <h3 class="headline-large">{{ event.title }}</h3>
        <div class="event-metadata">
          <div class="metadata-item">
            <mat-icon>calendar_today</mat-icon>
            <span>{{ event.startDate }}</span>
          </div>
          <div class="metadata-item">
            <mat-icon>location_on</mat-icon>
            <span>{{ event.venue }}</span>
          </div>
        </div>
      </div>

      <!-- Marketplace Specific Info -->
      <div class="event-info marketplace-info" *ngIf="selectedPill === 'Marketplace'">
        <div class="event-main-details">
          <h3 class="headline-large">{{ event.title }}</h3>
          <div class="ticket-details">
            <span class="ticket-type">{{ event.ticketType }}</span>
            <span class="ticket-location">{{ event.location }}</span>
          </div>
        </div>

        <div class="marketplace-footer">
          <div class="seller-info">
            <img [src]="event.sellerPhoto" class="seller-photo" [alt]="event.sellerName">
            <span class="seller-name">{{ event.sellerName }}</span>
          </div>
          <div class="price-tag">
            {{ event.price | currency:'$':'symbol':'1.0-0' }}
          </div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="!isLoading && pagedEvents.length > 0" class="pagination-container">
    <mat-paginator 
      [length]="totalEvents"
      [pageSize]="pageSize"
      [pageSizeOptions]="[8, 16, 24]"
      (page)="onPageChange($event)"
      aria-label="Seleccionar página">
    </mat-paginator>
  </div>
</div>
