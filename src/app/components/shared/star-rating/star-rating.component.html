<div class="star-rating" [class]="sizeClass">
  @for (star of stars; track star.value) {
    <div 
      class="star-rating__star"
      [class.star-rating__star--full]="star.state === 'full'"
      [class.star-rating__star--half]="star.state === 'half'"
      [class.star-rating__star--empty]="star.state === 'empty'"
      [class.star-rating__star--interactive]="!readonly"
      (click)="onStarClick(star.value)"
      (mouseenter)="onStarHover(star.value)"
      [title]="star.value.toFixed(1)"
    >
      @if (star.state === 'half') {
        <svg class="star-rating__icon" viewBox="0 0 24 24">
          <defs>
            <linearGradient [id]="'half-star-gradient-' + star.value">
              <stop offset="50%" stop-color="var(--md-sys-color-tertiary)" />
              <stop offset="50%" stop-color="var(--half-star-empty-color, var(--md-sys-color-outline))" />
            </linearGradient>
          </defs>
          <path [attr.fill]="'url(#half-star-gradient-' + star.value + ')'" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
        </svg>
      } @else {
        <mat-icon class="star-rating__icon">
          {{ star.state === 'full' ? 'star' : 'star_border' }}
        </mat-icon>
      }
    </div>
  }
  @if (!readonly) {
    <span class="star-rating__value">{{ rating.toFixed(1) }}</span>
  }
</div>
