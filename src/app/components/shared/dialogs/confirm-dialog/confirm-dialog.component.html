<div class="confirm-dialog-container">
    <h2 mat-dialog-title class="confirm-title" *ngIf="data.title">{{ data.title }}</h2>
    
    <mat-dialog-content class="confirm-message">
        {{ data.message || '¿Confirma eliminación?' }}
    </mat-dialog-content>

    <mat-dialog-actions class="dialog-actions">
        <button mat-raised-button [ngClass]="isDestructive() ? 'btn-danger' : 'btn-success'" (click)="onConfirm()">
            {{ data.confirmText || 'Eliminar' }}
        </button>
        <button mat-stroked-button *ngIf="!data.hideCancel" class="btn-outline" (click)="onCancel()">
            {{ data.cancelText || 'Cancelar' }}
        </button>
    </mat-dialog-actions>
</div>
