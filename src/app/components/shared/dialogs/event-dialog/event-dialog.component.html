<div class="user-dialog-container">
    <h2 mat-dialog-title>{{ isEditMode ? 'Modificar Evento' : 'Crear Evento' }}</h2>
    
    <mat-dialog-content>
        <form [formGroup]="eventForm" (ngSubmit)="onSubmit()">
            
            <div class="form-group">
                <label for="title">Título del Evento</label>
                <mat-form-field appearance="outline" class="custom-mat-form-field">
                    <input matInput id="title" formControlName="title">
                </mat-form-field>
            </div>

            <div class="form-group description-field">
                <label for="description">Descripción</label>
                <mat-form-field appearance="outline" class="custom-mat-form-field">
                    <textarea matInput id="description" formControlName="description" rows="6"></textarea>
                </mat-form-field>
            </div>

            <div class="multi-row">
                <div class="form-group half">
                    <label for="startDate">Fecha y Hora de Inicio</label>
                    <mat-form-field appearance="outline" class="custom-mat-form-field">
                        <input matInput id="startDate" formControlName="startDate" placeholder="DD/MM/AAAA HH:MM">
                    </mat-form-field>
                </div>
                <div class="form-group half">
                    <label for="endDate">Fecha y Hora de Fin</label>
                    <mat-form-field appearance="outline" class="custom-mat-form-field">
                        <input matInput id="endDate" formControlName="endDate" placeholder="DD/MM/AAAA HH:MM">
                    </mat-form-field>
                </div>
            </div>

            <div class="form-group venue-group">
                <label for="venue">Venue</label>
                <mat-form-field appearance="outline" class="custom-mat-select">
                    <mat-select id="venue" formControlName="venue">
                        <!-- Search Bar inside Select -->
                        <div class="select-search-header">
                            <mat-form-field appearance="outline" class="search-inner-field">
                                <mat-icon matPrefix>search</mat-icon>
                                <input matInput placeholder="Buscar por nombre o dirección..." 
                                       [(ngModel)]="venueSearch" 
                                       (ngModelChange)="filterVenues()"
                                       [ngModelOptions]="{standalone: true}"
                                       (keydown)="$event.stopPropagation()">
                            </mat-form-field>
                        </div>
                        
                        <mat-option *ngFor="let v of filteredVenues" [value]="v.id" class="venue-option">
                            <div class="venue-item">
                                <span class="venue-name">{{v.name}}</span>
                                <span class="venue-address">{{v.address}}</span>
                            </div>
                        </mat-option>
                    </mat-select>
                </mat-form-field>
                <a class="new-venue-link" (click)="openNewVenueDialog()">El Venue no se encuentra en la lista</a>
            </div>

            <div class="form-group cancel-section" *ngIf="isEditMode && eventForm.get('status')?.value !== 'CANCELADO'">
                <button type="button" mat-button color="warn" class="btn-cancel-event" (click)="cancelEvent()">
                    <mat-icon>cancel</mat-icon>
                    CANCELAR ESTE EVENTO
                </button>
            </div>

            <div class="status-indicator" *ngIf="isEditMode && eventForm.get('status')?.value === 'CANCELADO'">
                <mat-icon color="warn">error</mat-icon>
                <span>Este evento ha sido CANCELADO</span>
            </div>

        </form>
    </mat-dialog-content>

    <mat-dialog-actions class="dialog-actions">
        <button mat-raised-button class="btn-submit" 
                [disabled]="eventForm.invalid" 
                (click)="onSubmit()">
            {{ isEditMode ? 'Guardar Cambios' : 'Guardar' }}
        </button>
        <button mat-stroked-button class="btn-cancel" (click)="onCancel()">Cancelar</button>
    </mat-dialog-actions>
</div>
