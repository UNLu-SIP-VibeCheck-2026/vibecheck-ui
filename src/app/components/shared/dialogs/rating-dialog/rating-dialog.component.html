<h2 mat-dialog-title>Calificar Organizador</h2>

<mat-dialog-content>
  <p class="rating-dialog__subtitle">
    Calificando a <strong>&#64;{{ data.organizerName }}</strong>
  </p>
  
  <div class="rating-dialog__rating-container">
    <app-star-rating
      [rating]="selectedRating"
      [readonly]="false"
      [size]="'large'"
      (ratingChanged)="onRatingChanged($event)"
    ></app-star-rating>
  </div>

  <p class="rating-dialog__hint">
    Primer toque: media estrella<br>
    Segundo toque: estrella completa
  </p>

  <div class="rating-dialog__comment-container">
    <label for="ratingText" class="rating-dialog__comment-label">Dejar un comentario (opcional):</label>
    <textarea
      id="ratingText"
      class="rating-dialog__comment-textarea"
      [(ngModel)]="ratingText"
      maxlength="500"
      placeholder="¿Qué te pareció el evento y la organización?..."
      [disabled]="isSubmitting"
    ></textarea>
    <div class="rating-dialog__char-counter">
      {{ ratingText.length }}/500
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button 
    mat-button 
    (click)="onCancel()"
    [disabled]="isSubmitting"
  >
    Cancelar
  </button>
  <button 
    mat-raised-button 
    color="primary"
    (click)="onConfirm()"
    [disabled]="!isValid || isSubmitting"
  >
    @if (isSubmitting) {
      <span>Enviando...</span>
    } @else {
      <span>Confirmar</span>
    }
  </button>
</mat-dialog-actions>
