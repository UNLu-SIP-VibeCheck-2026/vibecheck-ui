<nav class="navbar">
  <div class="logo-container" (click)="navigateToHome()">
    <div class="logo-icon gradient-border">
      <img src="assets/VC.png" alt="VibeCheck Logo" class="nav-logo-img">
    </div>
    <span class="logo-text">VibeCheck</span>
  </div>

  <div class="nav-actions">
    <ng-container *ngIf="user$ | async as user; else loggedOut">
      <button mat-button [matMenuTriggerFor]="userMenu" class="user-menu-btn">
        <app-avatar
          *ngIf="fullUserProfile"
          [username]="fullUserProfile.username"
          [name]="fullUserProfile.name"
          [lastName]="fullUserProfile.lastName"
          [hasImage]="fullUserProfile.hasImage || false"
          [clickable]="true"
          [size]="'small'"
          (photoChanged)="onProfilePhotoChanged()"
        ></app-avatar>
        <mat-icon *ngIf="!fullUserProfile">account_circle</mat-icon>
        {{ user.username }}
        <mat-icon iconPositionEnd>arrow_drop_down</mat-icon>
      </button>

      <mat-menu #userMenu="matMenu">
        <button mat-menu-item (click)="navigateToDashboard()">
          <mat-icon>dashboard</mat-icon>
          <span>Dashboard</span>
        </button>
        <button mat-menu-item (click)="navigateToMyListings()">
          <mat-icon>sell</mat-icon>
          <span>Mis Reventas</span>
        </button>
        <button mat-menu-item (click)="navigateToMyPublicProfile()">
          <mat-icon>person</mat-icon>
          <span>Ver mi Perfil</span>
        </button>
        <button mat-menu-item (click)="navigateToPerfilConfig()">
          <mat-icon>manage_accounts</mat-icon>
          <span>Configuración</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()">
          <mat-icon color="warn">exit_to_app</mat-icon>
          <span style="color: var(--md-sys-color-error);">Cerrar sesión</span>
        </button>
      </mat-menu>
    </ng-container>

    <ng-template #loggedOut>
      <button class="btn-cta" (click)="navigateToLogin()"
        style="height: 36px; padding: 0 20px; border-radius: 50px;">
        <span class="btn-cta__label" style="padding: 0; font-size: 13px;">ACCEDER</span>
      </button>
    </ng-template>
  </div>
</nav>
