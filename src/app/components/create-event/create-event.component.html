<div class="create-event-page">
    <div class="page-header">
        <h1 class="brand-title">Crea tu próximo Evento</h1>
    </div>

    <mat-card class="create-event-card">
        <form [formGroup]="eventForm" (ngSubmit)="onSubmit()">
            
            <div class="form-top-section">
                <!-- Left: Photo section -->
                <div class="photo-section">
                    <div class="photo-header">
                        <label>Foto del Evento</label>
                        <button type="button" class="select-file-btn">Seleccionar Archivo</button>
                    </div>
                    <div class="photo-preview">
                        <mat-icon class="preview-placeholder-icon">add_a_photo</mat-icon>
                    </div>
                </div>

                <!-- Right: Title and Description -->
                <div class="basic-info-section">
                    <div class="form-group custom-field-wrapper">
                        <label for="title">Título del Evento</label>
                        <mat-form-field appearance="outline" class="custom-mat-form-field" subscriptSizing="dynamic">
                            <input matInput type="text" id="title" formControlName="title" placeholder="Ej: Festival de Verano 2026">
                        </mat-form-field>
                    </div>

                    <div class="form-group custom-field-wrapper">
                        <label for="description">Descripción</label>
                        <mat-form-field appearance="outline" class="custom-mat-form-field textarea-field" subscriptSizing="dynamic">
                            <textarea matInput id="description" formControlName="description" placeholder="Cuéntale a la gente de qué trata tu evento..."></textarea>
                        </mat-form-field>
                    </div>
                </div>
            </div>

            <!-- Categories -->
            <div class="form-group custom-field-wrapper mt-24">
                <label>Categorías</label>
                <mat-form-field appearance="outline" class="custom-mat-form-field" subscriptSizing="dynamic">
                    <mat-select formControlName="category" placeholder="Selecciona una o más categorías">
                        <mat-option *ngFor="let cat of categories" [value]="cat.value">
                            {{cat.viewValue}}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
                <div class="selected-chips">
                    <mat-chip-set>
                        <mat-chip *ngFor="let cat of selectedCategories" (removed)="removeCategory(cat)">
                            {{cat}}
                            <button matChipRemove>
                                <mat-icon>cancel</mat-icon>
                            </button>
                        </mat-chip>
                    </mat-chip-set>
                </div>
            </div>

            <!-- Start Date and Time -->
            <div class="form-group custom-field-wrapper mt-24">
                <label>Inicio del Evento</label>
                <div class="multi-input-row">
                    <mat-form-field appearance="outline" class="custom-mat-form-field small" subscriptSizing="dynamic">
                        <input matInput type="number" formControlName="startDay" placeholder="DD">
                    </mat-form-field>
                    <mat-form-field appearance="outline" class="custom-mat-form-field small" subscriptSizing="dynamic">
                        <input matInput type="number" formControlName="startMonth" placeholder="MM">
                    </mat-form-field>
                    <mat-form-field appearance="outline" class="custom-mat-form-field medium" subscriptSizing="dynamic">
                        <input matInput type="number" formControlName="startYear" placeholder="AAAA">
                    </mat-form-field>
                    <mat-form-field appearance="outline" class="custom-mat-form-field medium" subscriptSizing="dynamic">
                        <input matInput type="text" formControlName="startTime" placeholder="HH:MM">
                    </mat-form-field>
                </div>
            </div>

            <!-- End Date and Time -->
            <div class="form-group custom-field-wrapper mt-24">
                <label>Finalización del Evento</label>
                <div class="multi-input-row">
                    <mat-form-field appearance="outline" class="custom-mat-form-field small" subscriptSizing="dynamic">
                        <input matInput type="number" formControlName="endDay" placeholder="DD">
                    </mat-form-field>
                    <mat-form-field appearance="outline" class="custom-mat-form-field small" subscriptSizing="dynamic">
                        <input matInput type="number" formControlName="endMonth" placeholder="MM">
                    </mat-form-field>
                    <mat-form-field appearance="outline" class="custom-mat-form-field medium" subscriptSizing="dynamic">
                        <input matInput type="number" formControlName="endYear" placeholder="AAAA">
                    </mat-form-field>
                    <mat-form-field appearance="outline" class="custom-mat-form-field medium" subscriptSizing="dynamic">
                        <input matInput type="text" formControlName="endTime" placeholder="HH:MM">
                    </mat-form-field>
                </div>
            </div>

            <!-- Venue -->
            <div class="form-group venue-group custom-field-wrapper mt-24">
                <label for="venue">Lugar (Venue)</label>
                <mat-form-field appearance="outline" class="custom-mat-form-field" subscriptSizing="dynamic">
                    <mat-select id="venue" formControlName="venue" placeholder="Selecciona el recinto del evento">
                        <!-- Search Bar inside Select -->
                        <div class="select-search-header">
                            <mat-form-field appearance="outline" class="search-inner-field" subscriptSizing="dynamic">
                                <mat-icon matPrefix>search</mat-icon>
                                <input matInput placeholder="Buscar por nombre o dirección..." 
                                       [(ngModel)]="venueSearch" 
                                       (ngModelChange)="filterVenues()"
                                       [ngModelOptions]="{standalone: true}"
                                       (keydown)="$event.stopPropagation()">
                            </mat-form-field>
                        </div>

                        <mat-option *ngFor="let venue of filteredVenues" [value]="venue.id" class="venue-option">
                            <div class="venue-item">
                                <span class="venue-name">{{venue.name}}</span>
                                <span class="venue-address">{{venue.address}}</span>
                            </div>
                        </mat-option>
                    </mat-select>
                </mat-form-field>
                <a class="new-venue-link" (click)="openNewVenueDialog()">¿El venue que buscás no está en la lista? Creá uno nuevo.</a>
            </div>

            <!-- Actions -->
            <div class="form-actions-row">
                <button mat-raised-button
                        type="submit"
                        [disabled]="isSubmitting || eventForm.invalid"
                        class="custom-btn-submit">
                    {{ isSubmitting ? 'Procesando...' : 'Publicar Evento' }}
                </button>
                <button mat-button
                        type="button"
                        (click)="cancel()"
                        class="custom-btn-cancel">
                    Cancelar
                </button>
            </div>

        </form>
    </mat-card>
</div>
