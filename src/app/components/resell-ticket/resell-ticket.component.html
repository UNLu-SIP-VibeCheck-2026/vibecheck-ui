<div class="resell-container">
  <!-- Header -->
  <div class="header">
    <button mat-icon-button (click)="goBack()" class="btn-back">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1 class="display-medium">Revender Entrada</h1>
  </div>

  <!-- Loading State -->
  <app-loading-state *ngIf="isLoading" [mode]="'spinner'"></app-loading-state>

  <!-- Error State -->
  <div class="alert alert-danger" *ngIf="!isLoading && errorMessage">
    <mat-icon class="alert-icon">warning</mat-icon>
    <span class="alert-text">{{ errorMessage }}</span>
    <button mat-flat-button color="warn" (click)="goBack()" class="btn-back-error">
      Volver
    </button>
  </div>

  <!-- Create Listing Component integration -->
  <div class="listing-form-wrapper" *ngIf="!isLoading && ticket">
    <app-create-listing [ticket]="ticket" (listed)="onTicketListed()"></app-create-listing>
  </div>
</div>
